
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Surprise !</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #111111;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    main {
      width: 100%;
    }

    h1 {
      color: white;
      font-size: clamp(38px, 11vw, 76px);
      font-weight: 900;
      line-height: 1.3;
      margin: 0;
      letter-spacing: -2px;
    }

    .jaune {
      color: #ffcc33;
    }
  </style>
</head>
<body>
  <main>
    <h1>
      FOURRE-TOI<br>
      UN BAGEL<br>
      <span class="jaune">DANS L'CUL !</span>

  </main>

</html>
